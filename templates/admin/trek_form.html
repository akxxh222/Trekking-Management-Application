{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-body p-4">

                <h4 class="mb-4">{{ 'Edit Trek' if trek else 'Create Trek' }}</h4>

                <form method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label class="form-label" for="trek-name">Trek Name</label>
                        <input type="text" id="trek-name" name="name" class="form-control" required
                               value="{{ trek.name if trek else '' }}">
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="trek-location">Location</label>
                        <input type="text" id="trek-location" name="location" class="form-control" required
                               value="{{ trek.location if trek else '' }}">
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="trek-difficulty">Difficulty</label>
                        <select id="trek-difficulty" name="difficulty" class="form-select" required>
                            <option value="">-- Select --</option>
                            {% for level in ['Easy', 'Medium', 'Hard'] %}
                            <option value="{{ level }}"
                                {% if trek and trek.difficulty == level %}selected{% endif %}>
                                {{ level }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="trek-duration">Duration (days)</label>
                        <input type="number" id="trek-duration" name="duration_days" class="form-control" required min="1" step="1"
                               value="{{ trek.duration_days if trek else '' }}">
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="trek-slots">Total Slots</label>
                        <input type="number" id="trek-slots" name="total_slots" class="form-control" required min="1" step="1"
                               value="{{ trek.total_slots if trek else '' }}">
                    </div>

                    {% if trek %}
                    <div class="mb-3">
                        <label class="form-label" for="trek-status">Status</label>
                        <select id="trek-status" name="status" class="form-select">
                            {% for s in ['Pending', 'Open', 'Closed', 'Started', 'Ongoing', 'Completed'] %}
                            <option value="{{ s }}" {% if trek.status == s %}selected{% endif %}>{{ s }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    {% endif %}

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-dark">
                            {{ 'Update Trek' if trek else 'Create Trek' }}
                        </button>
                        <a href="{{ url_for('admin_treks') }}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>

            </div>
        </div>
    </div>
</div>
{% endblock %}
