{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">

        <div class="card shadow-sm mt-5">
            <div class="card-body p-4">
                <h4 class="card-title mb-4 text-center">Register</h4>

                <form method="POST" action="{{ url_for('register') }}">
                    <div class="mb-3">
                        <label class="form-label">Full Name</label>
                        <input type="text" name="name" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" name="email" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Register as</label>
                        <select name="role" class="form-select" required>
                            <option value="trekker">Trekker</option>
                            <option value="staff">Trek Staff</option>
                        </select>
                    </div>

                    <button type="submit" class="btn btn-dark w-100">Register</button>
                </form>

                <p class="text-center mt-3 mb-0">
                    Already have an account?
                    <a href="{{ url_for('login') }}">Login here</a>
                </p>
            </div>
        </div>

    </div>
</div>
<div class="row justify-content-center" style="min-height: 80vh; align-items: center;"></div>
{% endblock %}
