{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">

        <div class="card shadow-sm mt-5">
            <div class="card-body p-4">
                <h4 class="card-title mb-4 text-center">Register</h4>

                <form method="POST" action="{{ url_for('register') }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label class="form-label" for="register-name">Full Name</label>
                        <input type="text" id="register-name" name="name" class="form-control"
                               value="{{ request.args.get('name', '') }}" autocomplete="name" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="register-email">Email</label>
                        <input type="email" id="register-email" name="email" class="form-control"
                               value="{{ request.args.get('email', '') }}" autocomplete="email" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="register-password">Password</label>
                        <input type="password" id="register-password" name="password" class="form-control"
                               autocomplete="new-password" minlength="8" required>
                        <div class="form-text">Use at least 8 characters.</div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="register-role">Register as</label>
                        <select id="register-role" name="role" class="form-select" required>
                            <option value="trekker" {% if request.args.get('role') != 'staff' %}selected{% endif %}>Trekker</option>
                            <option value="staff" {% if request.args.get('role') == 'staff' %}selected{% endif %}>Trek Staff</option>
                        </select>
                    </div>

                    <button type="submit" class="btn btn-dark w-100">Register</button>
                </form>

                <p class="text-center mt-3 mb-0">
                    Already have an account?
                    <a href="{{ url_for('login') }}">Login here</a>
                </p>
            </div>
        </div>

    </div>
</div>
{% endblock %}
