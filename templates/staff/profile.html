{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h4 class="mb-4">Edit Profile</h4>

                <form method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label class="form-label" for="staff-name">Full Name</label>
                        <input type="text" id="staff-name" name="name" class="form-control"
                               value="{{ user.name }}" autocomplete="name" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="staff-email">Email</label>
                        <input type="email" id="staff-email" class="form-control"
                               value="{{ user.email }}" disabled>
                        <div class="form-text">Email cannot be changed.</div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="staff-password">New Password</label>
                        <input type="password" id="staff-password" name="password" class="form-control"
                               autocomplete="new-password" minlength="8"
                               placeholder="Leave blank to keep current password">
                        <div class="form-text">Use at least 8 characters if changing it.</div>
                    </div>

                    <button type="submit" class="btn btn-dark">Save Changes</button>
                    <a href="{{ url_for('staff_dashboard') }}" class="btn btn-outline-secondary ms-2">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
