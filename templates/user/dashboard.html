{% extends 'base.html' %}

{% block content %}
<h4 class="mb-4">Welcome, {{ user.name }}</h4>

<div class="row g-3 mb-4">
    <div class="col-md-4">
        <div class="card text-center p-3 border-0 bg-light">
            <h2 class="fw-bold">{{ total_bookings }}</h2>
            <p class="text-muted mb-0">Total Bookings</p>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card text-center p-3 border-0 bg-light">
            <h2 class="fw-bold">{{ active_bookings }}</h2>
            <p class="text-muted mb-0">Active Bookings</p>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card text-center p-3 border-0 bg-light">
            <h2 class="fw-bold">{{ total_bookings - active_bookings }}</h2>
            <p class="text-muted mb-0">Completed / Cancelled</p>
        </div>
    </div>
</div>

<div class="row g-3">
    <div class="col-md-3">
        <a href="{{ url_for('user_treks') }}" class="btn btn-dark w-100 py-3">Browse Treks</a>
    </div>
    <div class="col-md-3">
        <a href="{{ url_for('my_bookings') }}" class="btn btn-dark w-100 py-3">My Bookings</a>
    </div>
    <div class="col-md-3">
        <a href="{{ url_for('trekking_history') }}" class="btn btn-dark w-100 py-3">Trekking History</a>
    </div>
    <div class="col-md-3">
        <a href="{{ url_for('user_profile') }}" class="btn btn-outline-dark w-100 py-3">Edit Profile</a>
    </div>
</div>
{% endblock %}
